[project]
name = "project"
version = "0.0.1"
description = "Add your description here"
authors = [
    { name = "Nisarg", email = "singhnisarg@gmail.com" }
]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "catboost>=1.2.10",
    "matplotlib>=3.11.2",
    "numpy>=2.4.6",
    "pandas>=3.1.1",
    "scikit-learn>=1.9.1",
    "seaborn>=0.13.2",
    "xgboost>=3.2.0",
]

[project.scripts]
project = "project:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[tool.basedpyright]
typeCheckingMode = "basic"
